# Builds the browser viewer (crates/ng-web: wasm, WebGPU with a WebGL2
# fallback) and publishes it on GitHub Pages.
#
# Setup, once: Settings → Pages → Source: "GitHub Actions".
#
# Everything the build needs comes from this repository and crates.io
# (threers, exg-nifti, exg-zarr).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# under way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `PROFILE` for scripts/build-web.sh: the small optimized wasm build.
  PROFILE: release-wasm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable, wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.PROFILE }}

      # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print}' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build
        run: scripts/build-web.sh

      # The page, its decode worker and the wasm package; `.nojekyll` so
      # Pages serves the files as they are.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R crates/ng-web/www/. _site/
          touch _site/.nojekyll
          ls -la _site _site/pkg

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
