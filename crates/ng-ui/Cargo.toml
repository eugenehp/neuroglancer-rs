[package]
name = "ng-ui"
description = "neuroglancer's user interface — top bar, layer bar, panel controls — drawn with threers::ui over the engine (ng-viewer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
ng-core.workspace = true
ng-viewer.workspace = true
threers = { workspace = true, features = ["ui"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `Math.random` for random bytes (the clock is not available there).
js-sys = "0.3"

[dev-dependencies]
ng-datasource.workspace = true
futures.workspace = true
ng-chunk.workspace = true
wgpu.workspace = true
